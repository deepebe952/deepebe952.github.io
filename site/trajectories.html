<body data-page="trajectories">
<main>
  <header class="page-head"><div class="wrap">
    <a class="btn primary task-back" id="r-back" href="index.html#results">← Back to task</a>
    <div class="crumbs"><a href="index.html">Home</a><span>/</span><a href="index.html#results">Tasks</a><span>/</span><a id="r-tasklink" href="index.html#results">Task</a><span>/</span><span>Run log</span></div>

    <p class="lede" id="r-lede">Scores and submission history for the selected task and configuration.</p>
  </div></header>
  <section class="sec"><div class="wrap stack" id="explorer">
    <div class="card">
      <div class="card-head">
        <div class="run-controls">
          <span class="tool-label">Configuration</span>
          <span class="seg" id="r-model"></span>
        </div>
      </div>
      <div class="kpis" id="r-kpis"></div>
      <div class="card-body">
        <div class="chart" id="r-chart"></div>

  </div></section>
