name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Rebuild the data bundle
        run: |
          python scripts/build_data.py
          python scripts/extract_behavior_figures.py
      - name: Committed bundle matches the sources
        run: git diff --exit-code -- site/data
      - name: Numbers reproduce the paper
        run: python -m unittest discover -s tests -v
      - name: Site checks
        run: |
          for f in site/assets/js/*.js; do node --check "$f"; done
          python scripts/check_site.py
          python scripts/extract_experimental_figures.py --check
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
